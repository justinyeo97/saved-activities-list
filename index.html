<!DOCTYPE html>
<html lang="en">
  <head>
    <title id="title">Log In - Watudu</title>
    <link rel="icon" type="image/png" href="w.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <!-- Bootstrap CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css" />
    <!-- As a heading -->
    <header id="logo"class="brand justify-content-center text-align-center align-items-center">
      <div id="logo-container" class="d-flex align-items-center">
      <img class="logo-img img-fluid" src="w.png" alt="Watudu Logo" width="100" height="100">
      <h1 id="logo-text" class="text-glow">atudu</h1>
      </div>
      <p><strong>Find Your Perfect Activity</strong></p>
    </header>
  </head>
  <body>
    <main>
      <div class="container my-5" id = "loginPage">
        <form id = "loginForm" class="w-75 mx-auto border border-2 rounded p-4">
          <div class="mb-3 text-start">
            <label for="username" class="form-label"><strong>Username</strong></label>
            <input type="text" class="form-control" id="username" aria-describedby="emailHelp">
          </div>
          <div class="mb-3 text-start">
            <label for="password" class="form-label"><strong>Password</strong></label>
            <input type="password" class="form-control" id="password">
             <div id="disclaimer" class="form-text text-start">
              We'll never share your username or password with anyone else.
            </div>
          </div>
          <button id="loginButton" type="button" class="btn btn-primary width-100">Login</button>
        </form>
      </div>

    <div id="dashboard" class="container-fluid my-5">
  <div class="d-flex gap-4 align-items-start">
    
    <!-- Left column: button above activity card -->
    <div class="d-flex flex-column">
      <button id="getAct" type="button" class="btn btn-warning mb-3">Feeling Lucky?</button>
      <section class="card text-left border-success d-none mb-3" id="activity" style="min-width: 500px; max-width: 500px;"></section>
    </div>
  <aside style="min-width: 250px; max-width: 250px;">
    <div style="display: flex; flex-direction: column;">
      <h4 style="margin-bottom: 0.5rem; border-color: black;" class="text-decoration-underline"><strong>Saved Activities</strong></h4>
      <ul id="savedList" class="list-group text-capitalize" style="margin-top: 20px; padding: 0; text-align: left;"></ul>
    </div>
  </aside>

  </div>
</div>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
