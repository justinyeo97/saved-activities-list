<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Activ8</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <div class="container my-5" id = "loginPage">
        <form class="w-75 mx-auto border border-2 border-primary rounded p-4">
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password">
             <div id="disclaimer" class="form-text text-start">
              We'll never share your username or password with anyone else.
            </div>
          </div>
          <button id="loginButton" type="button" class="btn btn-primary width-100">Login</button>
        </form>
      </div>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
